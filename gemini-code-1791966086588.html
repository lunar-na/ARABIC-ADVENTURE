<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahasa Arab RPG: Quest for Knowledge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
        }
        .font-rpg { font-family: 'Cinzel', serif; }
        .glow-box { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        .arabic-text { font-family: 'Amiri', 'Traditional Arabic', serif; font-size: 1.6rem; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- MAIN CONTAINER -->
    <div id="game-card" class="max-w-2xl w-full bg-slate-900 border-2 border-purple-500/50 rounded-2xl p-6 glow-box relative overflow-hidden">
        
        <!-- HEADER HUD -->
        <div class="flex justify-between items-center border-b border-purple-500/30 pb-4 mb-6">
            <div>
                <h1 class="font-rpg text-xl text-amber-400 tracking-wider"><i class="fa-solid fa-shield-halved mr-2"></i>ARABIC QUEST V</h1>
                <p id="player-class" class="text-xs text-purple-300 font-semibold">CLASS: NOVICE ADVENTURER</p>
            </div>
            <!-- EXP & HP BAR -->
            <div class="w-1/2 space-y-2">
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-emerald-400 font-bold">HP (PLAYER)</span>
                        <span id="hp-text" class="text-emerald-400">100/100</span>
                    </div>
                    <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden">
                        <div id="hp-bar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-amber-400 font-bold">EXP</span>
                        <span id="exp-text" class="text-amber-400">0 EXP</span>
                    </div>
                    <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div id="exp-bar" class="bg-amber-400 h-full transition-all duration-300" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOSS MONSTER DISPLAY -->
        <div class="text-center my-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700 relative">
            <span class="absolute top-2 left-3 text-xs text-rose-400 font-bold tracking-widest"><i class="fa-solid fa-skull"></i> BOSS ENCOUNTER</span>
            <div id="boss-avatar" class="text-5xl my-2 transform hover:scale-110 transition duration-200">🐉</div>
            <p id="boss-name" class="text-sm font-bold text-rose-300">DEMON GUARDIAN OF ARABIC</p>
        </div>

        <!-- QUIZ CONTAINER -->
        <div id="quiz-box">
            <div id="question-number" class="text-xs font-bold text-purple-400 uppercase tracking-widest mb-1">STAGE 1 / 5</div>
            <div id="question" class="arabic-text text-center text-amber-200 bg-slate-800/90 p-4 rounded-lg mb-6 border border-amber-500/30 leading-relaxed">
                Loading quest...
            </div>

            <!-- OPTIONS CONTAINER -->
            <div id="options" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                <!-- Dynamic Options Here -->
            </div>
        </div>

        <!-- RESULT SCREEN (HIDDEN INITIALLY) -->
        <div id="result-box" class="hidden text-center py-8">
            <div id="result-icon" class="text-6xl mb-4">🏆</div>
            <h2 id="result-title" class="text-2xl font-rpg text-amber-400 mb-2">VICTORY ACHIEVED!</h2>
            <p id="result-desc" class="text-slate-300 mb-6">Anda telah berjaya menyelesaikan ujian Bahasa Arab!</p>
            <div id="final-rank" class="bg-purple-900/40 p-4 rounded-xl border border-purple-500/40 mb-6">
                <p class="text-xs text-purple-300">GELARAN CHARACTER RPG ANDA:</p>
                <p id="rank-title" class="text-xl font-bold text-amber-300 mt-1">ARCHMAGE OF ARABIC</p>
            </div>
            <button onclick="restartGame()" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition transform active:scale-95">
                <i class="fa-solid fa-rotate-right mr-2"></i> MAIN SEMULA
            </button>
        </div>

    </div>

    <!-- JAVASCRIPT GAME LOGIC -->
    <script>
        // SOALAN DARI DOKUMEN UASA BAHASA ARAB TAHUN 5
        const questions = [
            {
                question: "Pilih perkataan yang mengandungi huruf متشابهة bagi 'ف':",
                options: ["فِيلٌ", "أَصْفَرُ", "رَفٌ"],
                correct: 0 // (Soalan 1)[cite: 2]
            },
            {
                question: "اخْتَرْ الْإِجَابَةَ الصَّحِيحَةَ:\nكَلِمَاتٌ فِيهَا حَرْفُ 'ق'",
                options: ["سَائِقٌ", "أَزْرَقُ", "قَهْوَةٌ"],
                correct: 2 // (Soalan 2)[cite: 2]
            },
            {
                question: "Pilih kategori haiwan bagi 'الدُّبُّ' (Beruang) dan 'الأَسَدُ' (Singa):",
                options: ["الحَيَوَانَاتُ الأَلِيفُ (Jinak)", "المُفْتَرِسُ (Pemangsa)", "الطَّائِرُ (Burung)"],
                correct: 1 // (Soalan 33-35 / Bahasa Arab)[cite: 8]
            },
            {
                question: "Lengkapkan ayat berpandukan gambar: أَنَا أَطْبُخُ _______",
                options: ["السَّمَك", "الأَرُزَّ", "الكَعْك"],
                correct: 0 // (Soalan 41)[cite: 10]
            },
            {
                question: "Pilih gabungan perkataan yang betul bagi kelab sekolah:\n'نَادِي' + _______",
                options: ["الكَشَّافَةِ", "اللُّغَةِ (Bahasa)", "القَفْزُ"],
                correct: 1 // (Soalan 30)[cite: 7]
            }
        ];

        let currentQ = 0;
        let hp = 100;
        let exp = 0;
        const maxExp = questions.length * 20;

        function loadQuestion() {
            if (currentQ >= questions.length) {
                showResults();
                return;
            }

            document.getElementById("question-number").innerText = `STAGE ${currentQ + 1} / ${questions.length}`;
            document.getElementById("question").innerText = questions[currentQ].question;
            
            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";

            questions[currentQ].options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = "w-full bg-slate-800 hover:bg-purple-900/60 border border-purple-500/30 rounded-xl p-4 text-left arabic-text text-purple-100 transition duration-150 flex items-center justify-between group";
                btn.innerHTML = `<span>${opt}</span> <i class="fa-solid fa-wand-magic-sparkles opacity-0 group-hover:opacity-100 text-amber-400"></i>`;
                btn.onclick = () => checkAnswer(index);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            if (selectedIndex === questions[currentQ].correct) {
                exp += 20;
                document.getElementById("exp-bar").style.width = `${(exp / maxExp) * 100}%`;
                document.getElementById("exp-text").innerText = `${exp} EXP`;
                
                // Animate Boss Attack / Damage
                const boss = document.getElementById("boss-avatar");
                boss.classList.add("animate-bounce");
                setTimeout(() => boss.classList.remove("animate-bounce"), 500);
            } else {
                hp = Math.max(0, hp - 20);
                document.getElementById("hp-bar").style.width = `${hp}%`;
                document.getElementById("hp-text").innerText = `${hp}/100`;
                if(hp < 40) document.getElementById("hp-bar").className = "bg-rose-500 h-full transition-all duration-300";
            }

            currentQ++;
            if(hp > 0) {
                loadQuestion();
            } else {
                showResults(false);
            }
        }

        function showResults(win = true) {
            document.getElementById("quiz-box").classList.add("hidden");
            document.getElementById("result-box").classList.remove("hidden");

            const rankTitle = document.getElementById("rank-title");
            const resultTitle = document.getElementById("result-title");
            const resultIcon = document.getElementById("result-icon");

            if (!win) {
                resultIcon.innerText = "💀";
                resultTitle.innerText = "GAME OVER";
                resultTitle.className = "text-2xl font-rpg text-rose-500 mb-2";
                rankTitle.innerText = "FARMER / NOVICE VILLAGER";
            } else if (exp >= 80) {
                rankTitle.innerText = "⚔️ S-RANK HIGH ELVEN ARCHMAGE";
            } else if (exp >= 50) {
                rankTitle.innerText = "🛡️ A-RANK ROYAL KNIGHT";
            } else {
                rankTitle.innerText = "🗡️ B-RANK ADVENTURER";
            }
        }

        function restartGame() {
            currentQ = 0;
            hp = 100;
            exp = 0;
            document.getElementById("hp-bar").style.width = "100%";
            document.getElementById("hp-bar").className = "bg-emerald-500 h-full transition-all duration-300";
            document.getElementById("hp-text").innerText = "100/100";
            document.getElementById("exp-bar").style.width = "0%";
            document.getElementById("exp-text").innerText = "0 EXP";
            document.getElementById("quiz-box").classList.remove("hidden");
            document.getElementById("result-box").classList.add("hidden");
            loadQuestion();
        }

        // Run Game
        loadQuestion();
    </script>
</body>
</html>
